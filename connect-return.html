<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KickOff — Bank Connected</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0b1a0b; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; }
  .card { max-width:340px; }
  .tick { width:72px; height:72px; border-radius:50%; background:rgba(75,255,96,0.12);
    border:2px solid #4bff60; display:flex; align-items:center; justify-content:center; margin:0 auto 22px; }
  .tick svg { width:34px; height:34px; }
  h1 { font-size:22px; font-weight:800; margin-bottom:10px; }
  p { font-size:14px; line-height:1.6; color:rgba(255,255,255,0.65); }
  .hint { margin-top:22px; font-size:12px; color:#4bff60; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <div class="tick">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4bff60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1>You're all set</h1>
    <p>Your bank account is connected. You'll receive your organiser payouts here after each match.</p>
    <p class="hint">You can close this and head back to the KickOff app.</p>
  </div>
</body>
</html>
